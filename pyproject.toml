[project]
name = "binance-multibot-pro"
version = "2.0.0"
description = "Binance Pro Multi-Bot Crypto Trading Suite"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flet>=0.28.0",
    "ccxt>=4.4.0",
    "wsgiref==0.1.2",
]

[tool.flet]
org = "com.tradingbot"
product = "Binance Multi-Bot Pro"
company = "QuantBot"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.WAKE_LOCK" = true
"android.permission.POST_NOTIFICATIONS" = true
